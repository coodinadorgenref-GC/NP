name: Sync catálogo desde Google Drive

on:
  schedule:
    - cron: '0 9 * * *'   # todos los días 03:00 hora CDMX (09:00 UTC)
  workflow_dispatch:
    inputs:
      force_all:
        description: 'Reprocesar TODOS los PDFs (ignora fechas de modificacion). Usar tras un cambio en el parser.'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: |
          sudo apt-get update && sudo apt-get install -y tesseract-ocr
          pip install pdfplumber google-api-python-client google-auth pytesseract Pillow

      - name: Descargar PDFs nuevos/modificados de Drive
        env:
          GDRIVE_SA_KEY_JSON: ${{ secrets.GDRIVE_SA_KEY_JSON }}
        run: |
          mkdir -p downloads
          python scripts/sync_drive.py \
            --folder-id "${{ vars.GDRIVE_FOLDER_ID }}" \
            --out downloads \
            --manifest data/manifest.json \
            ${{ inputs.force_all && '--force' || '' }}

      - name: Reconstruir índice de compatibilidad
        run: |
          python scripts/build_index.py \
            --downloads downloads \
            --index data/refacciones_index.json

      - name: Commit y push si hubo cambios
        run: |
          git config user.name "sync-bot"
          git config user.email "sync-bot@users.noreply.github.com"
          git add data/manifest.json data/refacciones_index.json
          if git diff --cached --quiet; then
            echo "Sin cambios, no se commitea nada."
          else
            git commit -m "Sync automático de catálogo Drive ($(date -u +%Y-%m-%d))"
            git push
          fi
